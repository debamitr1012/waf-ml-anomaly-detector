version: '3.8'

services:
  # ML API Service
  ml-api:
    build: .
    container_name: waf-ml-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://waf_user:waf_password@postgres:5432/waf_ml_db
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    command: python src/main.py

  # Dashboard Service (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: waf-ml-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - ml-api
    restart: unless-stopped
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: waf-ml-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:13-alpine
    container_name: waf-ml-postgres
    environment:
      - POSTGRES_USER=waf_user
      - POSTGRES_PASSWORD=waf_password
      - POSTGRES_DB=waf_ml_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:

networks:
  default:
    name: waf-ml-network
